<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   
<title>春城桃</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* =========================
   COLOR PALETTE
   ========================= */

:root {
    --main-color: #16324f;
    --dark-blue: #16324f;
    --text-color: #1e3a5f;
    --sub-color: #3b5f86;
    --line-color: #b8d2f0;
    --bg-color: #eaf3ff;
    --box-color: #ffffff;
    --accent-color: #2c5d91;
}


/* =========================
   BASIC SETTINGS
   ========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0; 
   
    background: var(--bg-color); 
    color: var(--text-color); 
   
    font-family: 
       Georgia, 
       "Times New Roman", 
       serif; 
   
    line-height: 1.7;
}


/* =========================
   MAIN CONTAINER
   ========================= */

.character-page {
    max-width: 1000px;

    margin: 70px auto;
    padding: 0 35px;
}


/* =========================
   HEADER
   ========================= */

.character-header {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 60px;
    align-items: start;
    margin-bottom: 60px;
}


/* PC NAME */

.character-name {
    margin: 0;
    padding-top: 15px;
    color: #663399;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.15;
}

.character-quote {
    margin-top: 105px;
    margin-bottom: 0;

    color: #3b5f86;;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    line-height: 1.6;

    max-width: 650px;
}

/* small label above name */

.character-label {
    margin-bottom: 10px;
    color: var(--sub-color);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}


/* CHARACTER IMAGE */

.character-image {
    width: 220px;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    background: #D7E8F0;
    border: 1px solid var(--line-color);
}


/* =========================
   BASIC INFORMATION
   ========================= */

.basic-info {
    display: grid;
    grid-template-columns:
        repeat(5, 1fr);
    border-top: 1px solid var(--line-color);
    border-bottom: 1px solid var(--line-color);
    margin-bottom: 55px;
}

.info-item {
    padding: 20px 15px;
    border-right: 1px solid var(--line-color);
}

.info-item:last-child {
    border-right: none;
}

.info-label {
    display: block;
    margin-bottom: 5px;
    color: var(--sub-color);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
}

.info-value {
    color: var(--dark-blue);
    font-size: 17px;
}

/* =========================
   SECTION TITLES
   ========================= */

.section {
    margin-bottom: 60px;
}

.section-title {
    margin: 0 0 25px 0;
    color: var(--main-color);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}

.back-link {
    color: #2c5d91;
    text-decoration: none;
    font-size: 14px;

    font-family: "Noto Serif SC", serif;

    display: inline-block;
    margin-bottom: 25px;
}

.back-link:hover {
    color: #4a7fb8;
}
   
/* =========================
   ATTRIBUTES
   ========================= */

.attributes {
    display: grid;
    grid-template-columns:
        repeat(9, 1fr);
    border-top: 1px solid var(--line-color);
    border-bottom: 1px solid var(--line-color);
}

.attribute {
    padding: 18px 8px;
    text-align: center;
    border-right: 1px solid var(--line-color);
}

.attribute:last-child {
    border-right: none;
}

.attribute-name {
    display: block;
    color: var(--sub-color);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
}

.attribute-cn {
    display: block;
    margin-top: 2px;
    color: var(--sub-color);
    font-size: 11px;
}

.attribute-value {
    display: block;
    margin-top: 7px;
    color: var(--main-color);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 22px;
    font-weight: 700;
}

/* =========================
   TEXT FIELDS
   ========================= */

.field {
    padding-top: 22px;
    padding-bottom: 30px;
    border-top: 1px solid var(--line-color);
}

.field:first-child {
    border-top: none;
}

.field-title {
    margin: 0 0 10px 0;
    color: var(--main-color);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.field-text {
    margin: 0;
    max-width: 850px;
    color: var(--text-color);
    font-size: 16px;
}

/* =========================
   TWO-COLUMN FIELDS
   ========================= */

.two-columns {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    column-gap: 60px;
}

.two-columns .field {
    margin: 0;
}

/* =========================
   FOOTER
   ========================= */
   
.character-footer {
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
    color: #3b5f86;

    font-family: "Noto Serif SC", serif;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 750px) {
    .character-page {
        margin: 35px auto;
        padding: 0 20px;
    }

    .character-header {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .character-name {
        font-size: 40px;
    }

    .character-image {
        max-width: 320px;
    }

    .basic-info {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .info-item:nth-child(2n) {
        border-right: none;
    }

    .info-item {
        border-bottom:
            1px solid var(--line-color);
    }

    .attributes {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .attribute:nth-child(3n) {
        border-right: none;
    }

    .two-columns {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>
